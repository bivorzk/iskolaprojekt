name: Discord Notification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 New push to **${{ github.repository }}** on branch **${{ github.ref_name }}**\"}" \
            $DISCORD_WEBHOOK
