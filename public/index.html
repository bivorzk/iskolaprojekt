<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login - SnapTray</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mobile-enhancements.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFC857',
                        accent: '#FFE5DC',
                        gray: '#6C757D',
                    },
                },
            },
        }
    </script>
    <!-- PWA and mobile optimizations -->
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SnapTray">
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        const Login = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [loginData, setLoginData] = useState({
                username: '',
                password: '',
            });
            const [resetData, setResetData] = useState({
                email: '',
            });
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState({ text: '', type: '' });

            const handleLoginChange = (e) => {
                const { name, value } = e.target;
                setLoginData({
                    ...loginData,
                    [name]: value,
                });
            };

            const handleResetChange = (e) => {
                const { name, value } = e.target;
                setResetData({
                    ...resetData,
                    [name]: value,
                });
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ text: '', type: '' });

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams(loginData),
                    });

                    const data = await response.text();

                    if (response.ok) {
                        setMessage({ text: 'Login successful! Welcome back!', type: 'success' });
                         setTimeout(() => {
                             window.location.href = '/dashboard/student';
                        }, 1500);
                    } else {
                        setMessage({ text: data, type: 'error' });
                    }
                } catch (error) {
                    setMessage({ text: 'Login failed. Please try again.', type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const handleResetSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ text: '', type: '' });

                try {
                    const response = await fetch('/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(resetData),
                    });

                    const data = await response.text();

                    if (response.ok) {
                        setMessage({ text: data, type: 'success' });
                        setResetData({ email: '' });
                    } else {
                        setMessage({ text: data, type: 'error' });
                    }
                } catch (error) {
                    setMessage({ text: 'Error sending reset request. Please try again.', type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const switchToForgotPassword = () => {
                setIsLogin(false);
                setMessage({ text: '', type: '' });
            };

            const switchToLogin = () => {
                setIsLogin(true);
                setResetData({ email: '' });
                setMessage({ text: '', type: '' });
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-accent to-white flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-md w-full space-y-8">
                        {/* Logo */}
                        <div className="text-center">
                            <svg viewBox="0 0 500 140" className="mx-auto h-20 w-auto">
                                {/* Tray base */}
                                <rect x="25" y="55" width="90" height="50" rx="6" fill="#FF6B35"/>
                                {/* Tray compartments */}
                                <rect x="30" y="60" width="35" height="40" rx="3" fill="#FFE5DC"/>
                                <rect x="70" y="60" width="20" height="18" rx="3" fill="#FFE5DC"/>
                                <rect x="95" y="60" width="20" height="18" rx="3" fill="#FFE5DC"/>
                                <rect x="70" y="82" width="45" height="18" rx="3" fill="#FFE5DC"/>
                                {/* Lightning/Snap element */}
                                <path d="M80 25 L65 52 L75 52 L60 80 L85 50 L75 50 L90 25 Z" fill="#FFC857" stroke="#FF6B35" strokeWidth="2" strokeLinejoin="round"/>
                                {/* Text */}
                                <text x="150" y="85" fontFamily="system-ui, -apple-system, sans-serif" fontSize="56" fontWeight="bold" fill="#FF6B35" letterSpacing="-1">SnapTray</text>
                                <text x="150" y="110" fontFamily="system-ui, -apple-system, sans-serif" fontSize="20" fill="#6C757D" letterSpacing="2">SCHOOL CAFETERIA ORDERING</text>
                            </svg>
                        </div>

                        <div className="bg-white shadow-2xl rounded-lg p-8">
                            {isLogin ? (
                                <>
                                    <h2 className="text-3xl font-bold text-center text-primary mb-8">Login</h2>
                                    <form onSubmit={handleLoginSubmit} className="space-y-6">
                                        <div>
                                            <label htmlFor="username" className="block text-sm font-medium text-gray-700">
                                                Username
                                            </label>
                                            <input
                                                type="text"
                                                id="username"
                                                name="username"
                                                value={loginData.username}
                                                onChange={handleLoginChange}
                                                required
                                                className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary"
                                            />
                                        </div>

                                        <div>
                                            <label htmlFor="password" className="block text-sm font-medium text-gray-700">
                                                Password
                                            </label>
                                            <input
                                                type="password"
                                                id="password"
                                                name="password"
                                                value={loginData.password}
                                                onChange={handleLoginChange}
                                                required
                                                className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
                                        >
                                            {loading ? 'Logging in...' : 'Login'}
                                        </button>
                                    </form>

                                    <div className="mt-6 text-center space-y-2">
                                        <button
                                            onClick={switchToForgotPassword}
                                            className="text-sm text-primary hover:text-secondary font-medium"
                                        >
                                            Forgot Password?
                                        </button>
                                        <div>
                                            Don't have an account? <a href="register.html" className="text-sm text-gray-600 hover:text-primary">
                                                Register
                                            </a>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <h2 className="text-3xl font-bold text-center text-primary mb-8">Reset Password</h2>
                                    <p className="text-sm text-gray-600 text-center mb-6">
                                        Enter your email address and we'll send you a link to reset your password.
                                    </p>
                                    <form onSubmit={handleResetSubmit} className="space-y-6">
                                        <div>
                                            <label htmlFor="resetEmail" className="block text-sm font-medium text-gray-700">
                                                Email
                                            </label>
                                            <input
                                                type="email"
                                                id="resetEmail"
                                                name="email"
                                                value={resetData.email}
                                                onChange={handleResetChange}
                                                required
                                                className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary"
                                            />
                                        </div>

                                        <div className="space-y-3">
                                            <button
                                                type="submit"
                                                disabled={loading}
                                                className="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
                                            >
                                                {loading ? 'Sending...' : 'Send Reset Link'}
                                            </button>
                                            <button
                                                type="button"
                                                onClick={switchToLogin}
                                                className="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
                                            >
                                                Back to Login
                                            </button>
                                        </div>
                                    </form>
                                </>
                            )}

                            {message.text && (
                                <div className={`mt-6 p-4 rounded-md ${
                                    message.type === 'success'
                                        ? 'bg-green-50 border border-green-200 text-green-700'
                                        : 'bg-red-50 border border-red-200 text-red-700'
                                }`}>
                                    {message.text}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<Login />, document.getElementById('root'));
    </script>
</body>
</html>
