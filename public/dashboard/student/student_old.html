<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Student Panel</h2>
            <nav>
                <ul>
                    <li><a href="#users">Users</a></li>
                    <li><a href="#stats">Statistics</a></li>
                    <li><a href="#settings">Settings</a></li>
                    <li><a href="#logout">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header>
                <h1 id="welcome-message">Welcome, Student</h1>
            </header>
            <section id="orders-made">
                <h2>Your Orders</h2>
                <div class="order-history-list">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left">Order ID</th>
                                <th style="text-align:center">Date</th>
                                <th style="text-align:right; padding: 0 10px;">Total Amount</th>
                                <th style="text-align:right">Status</th>
                            </tr>
                        </thead>
                        <tbody id="order-history-list"></tbody>
                    </table>
                </div>
            </section>
            <section id="stats">
                <h2>Statistics</h2>
                <div class="stats-cards">
                    <div class="card">Total Users: <span id="total-users">--</span></div>
                    <div class="card">Active Sessions: <span id="active-sessions">--</span></div>
                    <div class="card">Orders Made: <span id="orders-made">--</span></div>
                    <div class="card">Total Menu Items: <span id="total-menu-items">--</span></div>
                    <div class="card">Payment Stats: <span id="payment-stats">--</span></div>
                    <div id="stock-alerts" style="margin: 1rem 0;"></div>
                </div>
            </section>
            <section id="settings">
                <h2>Settings</h2>
                <a href="/password_reset.html" class="btn">Change Password</a>
            </section>
        </main>
            
        <div class="money-upload-container">
            <h2>Upload Money to Wallet</h2>
            <div class="upload-input-row">
                <label for="uploadAmount">Amount:</label>
                <input type="number" id="uploadAmount" placeholder="Enter amount">
                <label for="uploadCurrency">Currency:</label>
                <select id="uploadCurrency">
                    <option value="HUF">HUF</option>
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                </select>
                
                <!-- Hidden fields for payment integration -->
                <input type="hidden" id="price" value="">
                <input type="hidden" id="convertedAmount" value="">
                <input type="hidden" id="currency" value="">
            </div>
            <button id="googlePayBtn" onclick="initializeGooglePay()">Pay with Google Pay</button>
            <div id="gpay-container"></div>
            <script async src="https://pay.google.com/gp/p/js/pay.js"></script>
            <div id="paypal-button-container"></div>
            <ul id="cart-list"></ul>
        </div>
    </div>
 
    <script src="student.js"></script>
    <script src="../../googlepay.js"></script>
    <script src="../../paypal.js"></script>

</body>
</html>
