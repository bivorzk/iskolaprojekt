<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SnapTray</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFC857',
                        accent: '#FFE5DC',
                        gray: '#6C757D',
                    },
                },
            },
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom hook -->
    <script type="text/babel" src="useStudentData.js"></script>

    <!-- Components -->
    <script type="text/babel" src="StudentHeader.jsx"></script>
    <script type="text/babel" src="StudentSidebar.jsx"></script>
    <script type="text/babel" src="OrdersSection.jsx"></script>
    <script type="text/babel" src="WalletSection.jsx"></script>
    <script type="text/babel" src="TransactionsSection.jsx"></script>
    <script type="text/babel" src="StatsSection.jsx"></script>
    <script type="text/babel" src="SettingsSection.jsx"></script>

    <!-- Main component -->
    <script type="text/babel" src="student.jsx"></script>
</body>
</html>
