
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <ul>
                    <li><a href="#users">Users</a></li>
                    <li><a href="#stats">Statistics</a></li>
                    <li><a href="#settings">Settings</a></li>
                    <li><a href="#logout">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header>
                <h1>Welcome, Admin</h1>
            </header>
            <section id="users">
                <h2>User Management</h2>
                <div class="user-list">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left">Username</th>
                                <th style="text-align:center">Email</th>
                                <th style="text-align:center; padding: 0 10px;">User Type</th>
                                <th style="text-align:right">Joined</th>
                                <th style="text-align:right; padding: 0 15px;">Actions</th>
                            
                            </tr>
                        </thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </section>
            <section id="stats">
                <h2>Statistics</h2>
                <div class="stats-cards">
                    <div class="card">Total Users: <span id="total-users">--</span></div>
                    <div class="card">Active Sessions: <span id="active-sessions">--</span></div>
                    <div class="card">Orders Made: <span id="orders-made">--</span></div>

                    <div style="margin-top:2rem;">
                    <h3>Registrations by date </h3>
                    <canvas id="signupChart" width="600" height="300"></canvas>
                    </div>
                </div>
            </section>
            <section id="settings">
                <h2>Settings</h2>
                <a href="/password_reset.html" class="btn">Change Password</a>
            </section>
        </main>
    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="admin.js"></script>
</body>
</html>
