<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Parent Dashboard - SnapTray</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js CDN (statisztikákhoz) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Saját mobil kiegészítő CSS -->
    <link rel="stylesheet" href="../../css/mobile-enhancements.css">

    <!-- Tailwind színek testreszabása -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFC857',
                        accent: '#FFE5DC',
                        gray: '#6C757D',
                    },
                },
            },
        }
    </script>

    <!-- PWA és mobil optimalizáció -->
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SnapTray Parent">
</head>
<body>
    <!-- React root -->
    <div id="root"></div>

    <!-- React és ReactDOM ES6 modul verzió CDN-ek -->
    <script type="module">
        import React from 'https://cdn.jsdelivr.net/npm/react@18/esm/react.development.js';
        import ReactDOM from 'https://cdn.jsdelivr.net/npm/react-dom@18/esm/react-dom.development.js';

        // Saját komponensek importja ES6 modulokkal
        import { useParentData } from './useParentData.js';
        import ParentHeader from './ParentHeader.jsx';
        import ParentSidebar from './ParentSidebar.jsx';
        import MobileParentNav from './MobileParentNav.jsx';
        import ParentStudentsSection from './ParentStudentsSection.jsx';
        import ParentStatsSection from './ParentStatsSection.jsx';
        import ParentOrdersSection from './ParentOrdersSection.jsx';
        import ParentSettingsSection from './ParentSettingsSection.jsx';
        import ParentPaymentButton from './ParentPaymentButton.jsx';
        import App from './parent.jsx';

        // Render a root div-be
        ReactDOM.createRoot(document.getElementById('root')).render(
            React.createElement(App)
        );
    </script>
</body>
</html>
