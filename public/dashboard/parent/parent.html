<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Parent Dashboard - SnapTray</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js CDN (statisztikákhoz) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Saját mobil kiegészítő CSS -->
    <link rel="stylesheet" href="../../css/mobile-enhancements.css">

    <!-- Tailwind színek testreszabása -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFC857',
                        accent: '#FFE5DC',
                        gray: '#6C757D',
                    },
                },
            },
        }
    </script>

    <!-- PWA és mobil optimalizáció -->
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SnapTray Parent">
</head>
<body>
    <!-- React root -->
    <div id="root"></div>

    <!-- React és ReactDOM CDN-ek -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="../../js/mobile-utils.js"></script>

    <!-- Custom hook -->
    <script type="text/babel" src="useParentData.js"></script>

    <!-- Components -->
    <script type="text/babel" src="ParentHeader.jsx"></script>
    <script type="text/babel" src="ParentSidebar.jsx"></script>
    <script type="text/babel" src="MobileParentNav.jsx"></script>
    <script type="text/babel" src="ParentStudentsSection.jsx"></script>
    <script type="text/babel" src="ParentStatsSection.jsx"></script>
    <script type="text/babel" src="ParentOrdersSection.jsx"></script>
    <script type="text/babel" src="ParentSettingsSection.jsx"></script>
    <script type="text/babel" src="ParentWalletSection.jsx"></script>
    <script type="text/babel" src="ParentTransactionsSection.jsx"></script>

    <!-- Main App -->
    <script type="text/babel" src="parent.jsx"></script>
</body>
</html>
