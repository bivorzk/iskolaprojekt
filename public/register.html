<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Registration</title>
    <link rel="stylesheet" href="css/register.css" />
</head>
<body>
    <div class="form-container">
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            
            <input type="checkbox" text="Parent Account" id="isParent" name="isParent">
            <!-- reCAPTCHA v3 badge will appear automatically -->
            <p style="font-size: 12px; color: #666; margin: 10px 0;">
                This site is protected by reCAPTCHA and the Google 
                <a href="https://policies.google.com/privacy">Privacy Policy</a> and 
                <a href="https://policies.google.com/terms">Terms of Service</a> apply.
            </p>
            
            <button type="submit">Register</button>
        </form>
        
        <div class="login-link">
            <p>Already have an account? <a href="/">Login here</a></p>
        </div>
    </div>


    <script>

const RECAPTCHA_SITE_KEY = '6LfkaeErAAAAAEzBV6Puvepk4UoMKNyMPlKqbQmk';
        
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Show loading state
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Verifying...';
            submitBtn.disabled = true;
            
            // Execute reCAPTCHA v3
            grecaptcha.ready(function() {
                console.log('reCAPTCHA ready, executing...');
                grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'register'}).then(function(token) {
                    console.log('reCAPTCHA token received:', token ? 'YES (length: ' + token.length + ')' : 'NO');
                    console.log('Token preview:', token ? token.substring(0, 50) + '...' : 'N/A');
                    
                    // Add CAPTCHA token to form and submit
                    let tokenInput = document.querySelector('input[name="g-recaptcha-response"]');
                    if (!tokenInput) {
                        tokenInput = document.createElement('input');
                        tokenInput.type = 'hidden';
                        tokenInput.name = 'g-recaptcha-response';
                        document.querySelector('form').appendChild(tokenInput);
                        console.log('Created new token input field');
                    }
                    tokenInput.value = token;
                    console.log('Token set in form field:', tokenInput.value ? 'YES' : 'NO');
                    
                    // Submit the form
                    const form = document.querySelector('form');
                    const formData = new FormData(form);
                    
                    console.log('Form data entries:');
                    for (let [key, value] of formData.entries()) {
                        console.log(key + ':', value);
                    }

                    fetch('/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams(formData)
                    }).then(response => {
                        if (response.ok) {
                            return response.text();
                        } else {
                            return response.text().then(text => Promise.reject(text));
                        }
                    }).then(message => {
                        alert('Registration successful: ' + message);
                        form.reset();
                    }).catch(error => {
                        alert('Registration failed: ' + error);
                    }).finally(() => {
                        // Reset button state
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    });
                    
                }).catch(function(error) {
                    console.error('reCAPTCHA error:', error);
                    alert('CAPTCHA verification failed. Please try again.');
                    // Reset button state
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                });
            });
        });
        </script>

    <script src="https://www.google.com/recaptcha/api.js?render=6LfkaeErAAAAAEzBV6Puvepk4UoMKNyMPlKqbQmk"></script>
</body>
</html>
