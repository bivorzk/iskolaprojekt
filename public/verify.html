<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - SnapTray</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFC857',
                        accent: '#FFE5DC',
                        gray: '#6C757D',
                    },
                },
            },
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const EmailVerification = () => {
            return (
                <div className="min-h-screen bg-gradient-to-br from-accent to-white flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-md w-full space-y-8">
                        {/* Logo */}
                        <div className="text-center">
                            <svg viewBox="0 0 500 140" className="mx-auto h-16 w-auto">
                                {/* Tray base */}
                                <rect x="25" y="55" width="90" height="50" rx="6" fill="#FF6B35"/>
                                {/* Tray compartments */}
                                <rect x="30" y="60" width="35" height="40" rx="3" fill="#FFE5DC"/>
                                <rect x="70" y="60" width="20" height="18" rx="3" fill="#FFE5DC"/>
                                <rect x="95" y="60" width="20" height="18" rx="3" fill="#FFE5DC"/>
                                <rect x="70" y="82" width="45" height="18" rx="3" fill="#FFE5DC"/>
                                {/* Lightning/Snap element */}
                                <path d="M80 25 L65 52 L75 52 L60 80 L85 50 L75 50 L90 25 Z" fill="#FFC857" stroke="#FF6B35" strokeWidth="2" strokeLinejoin="round"/>
                                {/* Text */}
                                <text x="150" y="85" fontFamily="system-ui, -apple-system, sans-serif" fontSize="56" fontWeight="bold" fill="#FF6B35" letterSpacing="-1">SnapTray</text>
                                <text x="150" y="105" fontFamily="system-ui, -apple-system, sans-serif" fontSize="14" fill="#6C757D" letterSpacing="2">SCHOOL CAFETERIA ORDERING</text>
                            </svg>
                        </div>

                        <div className="bg-white shadow-2xl rounded-lg p-8 text-center">
                            <div className="mb-6">
                                <div className="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                                    <svg className="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                                <h2 className="text-3xl font-bold text-primary mb-4">Email Verified!</h2>
                                <p className="text-gray-600 mb-8">
                                    Your email has been successfully verified. You can now log in to your account and start ordering from the cafeteria.
                                </p>
                            </div>

                            <div className="space-y-4">
                                <a
                                    href="/"
                                    className="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200"
                                >
                                    Go to Login Page
                                </a>
                                <a
                                    href="/Order/"
                                    className="w-full flex justify-center py-3 px-4 border border-primary rounded-md shadow-sm text-sm font-medium text-primary bg-white hover:bg-accent focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200"
                                >
                                    Start Ordering
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<EmailVerification />, document.getElementById('root'));
    </script>
</body>
</html>
