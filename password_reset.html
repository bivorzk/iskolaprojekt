<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="password"], input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <h2>Reset Your Password</h2>
    
    <!-- Forgot Password Form -->
    <div id="forgotPasswordSection">
        <h3>Request Password Reset</h3>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
    </div>

    <!-- Password Reset Form (shown when accessing via token) -->
    <div id="resetPasswordSection" style="display: none;">
        <h3>Enter New Password</h3>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New password:</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>

    <div id="message"></div>

    <script>
        // Check if we're on a password reset token URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = window.location.pathname.split('/password-reset/')[1];
        
        if (token) {
            // If token exists, show reset form and validate token
            document.getElementById('forgotPasswordSection').style.display = 'none';
            document.getElementById('resetPasswordSection').style.display = 'block';
            
            // Validate token on page load
            fetch(`/password-reset/${token}`)
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(data => {
                            showMessage(data, 'error');
                            document.getElementById('resetPasswordSection').style.display = 'none';
                        });
                    }
                    return response.text();
                })
                .catch(error => {
                    showMessage('Error validating token', 'error');
                    document.getElementById('resetPasswordSection').style.display = 'none';
                });
        }

        // Handle forgot password form
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
                
                const data = await response.text();
                showMessage(data, response.ok ? 'success' : 'error');
            } catch (error) {
                showMessage('Error sending reset request', 'error');
            }
        });

        // Handle password reset form
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            try {
                const response = await fetch(`/password-reset/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ newPassword, confirmPassword }),
                });
                
                const data = await response.text();
                showMessage(data, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    document.getElementById('resetPasswordForm').reset();
                }
            } catch (error) {
                showMessage('Error resetting password', 'error');
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
        }
    </script>
</body>
</html>
